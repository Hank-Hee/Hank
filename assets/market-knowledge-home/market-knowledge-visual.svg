<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" fill="none">
  <title>Wison integrated energy intelligence</title>
  <defs>
    <mask id="orbit-cutouts" maskUnits="userSpaceOnUse">
      <rect width="680" height="160" fill="#fff"/>
      <rect x="96" y="7" width="60" height="50" rx="18" fill="#000"/>
      <rect x="524" y="7" width="60" height="50" rx="18" fill="#000"/>
      <rect x="70" y="92" width="60" height="50" rx="18" fill="#000"/>
      <rect x="550" y="90" width="60" height="50" rx="18" fill="#000"/>
    </mask>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Exact ellipses replace hand-drawn Bézier loops for a smoother orbit. -->
    <g mask="url(#orbit-cutouts)">
      <ellipse cx="340" cy="80" rx="296" ry="64" stroke="#7FCAC8" stroke-opacity=".78" stroke-width="1.5"/>
      <ellipse cx="340" cy="80" rx="268" ry="48" stroke="#8EB7C8" stroke-opacity=".32" stroke-width="1.05"/>
    </g>

    <!-- Engineering -->
    <g transform="translate(102 13)">
      <rect width="48" height="38" rx="12" fill="#FFFFFF" fill-opacity=".045" stroke="#7FCAC8" stroke-opacity=".88" stroke-width="1.25"/>
      <path d="M11 8H29L36 15V30H11V8ZM29 8V15H36M16 19H30M16 24H27M16 29H24" stroke="#B8DFE2" stroke-width="1.2"/>
    </g>

    <!-- Module fabrication -->
    <g transform="translate(530 13)">
      <rect width="48" height="38" rx="12" fill="#FFFFFF" fill-opacity=".045" stroke="#7FCAC8" stroke-opacity=".88" stroke-width="1.25"/>
      <path d="M9 30V10H39V30M6 30H42M14 30V20H23V30M27 30V16H36V30M13 10L18 5M35 10L30 5M13 15H35" stroke="#B8DFE2" stroke-width="1.2"/>
    </g>

    <!-- Marine installation -->
    <g transform="translate(76 98)">
      <rect width="48" height="38" rx="12" fill="#FFFFFF" fill-opacity=".045" stroke="#7FCAC8" stroke-opacity=".84" stroke-width="1.25"/>
      <path d="M24 7V28M18 12H30M14 21C14 28 18 32 24 32C30 32 34 28 34 21M14 21L10 25M34 21L38 25" stroke="#B8DFE2" stroke-width="1.25"/>
      <circle cx="24" cy="7" r="3.4" stroke="#7FCAC8" stroke-width="1.15"/>
    </g>

    <!-- Market insight -->
    <g transform="translate(556 96)">
      <rect width="48" height="38" rx="12" fill="#FFFFFF" fill-opacity=".045" stroke="#7FCAC8" stroke-opacity=".88" stroke-width="1.25"/>
      <path d="M10 29V9M10 29H39M15 24L21 18L27 21L35 10" stroke="#B8DFE2" stroke-width="1.3"/>
      <circle cx="35" cy="10" r="2.6" fill="#D7B55B"/>
    </g>

    <!-- Simplified FLNG profile with one consistent engineering stroke rhythm. -->
    <g transform="translate(153 43)" stroke="#B8DFE2">
      <path d="M8 59H376C370 64 364 69 356 74H55C38 74 22 68 8 59Z" fill="#FFFFFF" fill-opacity=".035" stroke-width="1.6"/>
      <path d="M20 58H366" stroke="#7FCAC8" stroke-opacity=".9" stroke-width="1.4"/>

      <!-- Flare tower -->
      <path d="M25 58L39 5L53 58M30 43H48M33 31H45M36 19H42M30 43L45 31M33 31L43 19M37 18L43 7M35 5H47M42 5V1M47 3H53" stroke-width="1.2"/>

      <!-- Gas treatment -->
      <rect x="61" y="34" width="51" height="24" rx="2" fill="#FFFFFF" fill-opacity=".025" stroke-width="1.15"/>
      <rect x="69" y="27" width="35" height="7" rx="1.5" fill="#FFFFFF" fill-opacity=".025" stroke-width="1.1"/>
      <path d="M69 42H104M69 50H104M77 34V58M96 34V58" stroke-width="1.05"/>

      <!-- Liquefaction trains -->
      <rect x="120" y="26" width="70" height="32" rx="2" fill="#FFFFFF" fill-opacity=".025" stroke-width="1.2"/>
      <path d="M127 26V20H141V26M151 26V15M151 20H164M177 26V10M177 15H188M127 36H183M127 47H183M135 36V58M151 36V58M167 36V58M182 36V58" stroke-width="1.1"/>
      <path d="M130 31H184" stroke="#7FCAC8" stroke-width="1.05"/>

      <!-- Pipe rack -->
      <rect x="198" y="34" width="47" height="24" rx="2" fill="#FFFFFF" fill-opacity=".02" stroke-width="1.1"/>
      <path d="M198 42H245M198 50H245M206 34V58M221 34V58M237 34V58M202 32H239C246 32 250 28 250 22V18" stroke-width="1.05"/>

      <!-- Integrated process module -->
      <rect x="254" y="29" width="56" height="29" rx="2" fill="#FFFFFF" fill-opacity=".02" stroke-width="1.1"/>
      <path d="M260 29L304 58M304 29L260 58M254 39H310M254 49H310M266 29V23H281V29M290 29V18H301V29" stroke-width="1.05"/>

      <!-- Living quarters and helideck -->
      <rect x="318" y="18" width="35" height="40" rx="2" fill="#FFFFFF" fill-opacity=".025" stroke-width="1.2"/>
      <path d="M325 27H346M325 36H346M325 45H346M325 52H346M353 27H376M360 23H373" stroke-width="1.05"/>

      <!-- Hull structure and mooring -->
      <path d="M70 63V71M125 63V72M180 63V72M235 63V72M290 63V72M345 63V70" stroke="#7CABC0" stroke-opacity=".58" stroke-width="1"/>
      <path d="M23 66L4 78M29 68L14 79" stroke="#7FCAC8" stroke-opacity=".68" stroke-width="1.05"/>
    </g>
  </g>
</svg>
