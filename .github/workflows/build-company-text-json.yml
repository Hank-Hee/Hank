name: Build company text JSON

on:
  workflow_dispatch:
  push:
    paths:
      - "company-text-dashboard/data/company-data.xlsx"
      - "company-text-dashboard/vendor/xlsx.full.min.js"
      - "scripts/build-company-text-json.mjs"

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build browser-ready company data
        run: node scripts/build-company-text-json.mjs

      - name: Commit generated JSON
        run: |
          if git diff --quiet -- company-text-dashboard/data/company-data.json; then
            echo "No company data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company-text-dashboard/data/company-data.json
          git commit -m "Build company text JSON"
          git push
