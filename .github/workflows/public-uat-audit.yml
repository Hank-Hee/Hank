name: Public UAT Audit

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public HTTPS origin to audit
        required: true
        default: https://wison-knowledge-platform.wison.workers.dev
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: public-uat-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-public-uat')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UAT_BASE_URL: ${{ inputs.base_url || 'https://wison-knowledge-platform.wison.workers.dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --engine-strict --no-audit --no-fund
      - run: node scripts/audit-public-uat.mjs "$UAT_BASE_URL"

  load:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-public-uat')
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - concurrency: 20
            requests: 200
            max_p95_ms: 800
          - concurrency: 50
            requests: 500
            max_p95_ms: 800
          - concurrency: 100
            requests: 1000
            max_p95_ms: 800
          - concurrency: 200
            requests: 2000
            max_p95_ms: 1500
    env:
      UAT_BASE_URL: ${{ inputs.base_url || 'https://wison-knowledge-platform.wison.workers.dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --engine-strict --no-audit --no-fund
      - name: Run bounded public read load
        run: >-
          npm run uat:load --
          --base-url "$UAT_BASE_URL"
          --concurrency ${{ matrix.concurrency }}
          --requests ${{ matrix.requests }}
          --max-p95-ms ${{ matrix.max_p95_ms }}
