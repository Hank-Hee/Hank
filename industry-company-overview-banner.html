<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="全球能源、海工与工程企业信息检索平台">
  <title>行业公司概览</title>
  <link rel="stylesheet" href="assets/platform-banner/platform-banner.css?v=20260730-1">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      background: transparent;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
    }

    .platform-banner--company .platform-banner__visual { transform: translateY(-6px); }

    .platform-banner--company .platform-banner__visual img {
      position: absolute;
      display: block;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    .vessel-primary {
      right: 37%;
      bottom: 6px;
      width: min(57%, 520px);
      opacity: .7;
    }

    .vessel-secondary {
      top: 4px;
      right: 1%;
      width: min(41%, 370px);
      opacity: .61;
    }

    @media (max-width: 1199px) {
      .vessel-primary { right: 14%; width: min(60%, 460px); }
      .vessel-secondary { width: min(40%, 330px); opacity: .56; }
    }

    @media (max-width: 1023px) {
      .vessel-primary { right: 10%; width: min(64%, 420px); }
      .vessel-secondary { top: 9px; width: min(41%, 290px); opacity: .48; }
    }

    @media (max-width: 767px) {
      .platform-banner--company .platform-banner__visual { transform: none; }
      .vessel-secondary { display: none; }
      .vessel-primary {
        position: relative;
        right: auto;
        bottom: auto;
        width: min(86%, 300px);
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <main class="platform-banner-root banner-root">
    <section class="platform-banner platform-banner--company company-directory-banner" aria-labelledby="banner-title banner-subtitle">
      <div class="platform-banner__copy banner-copy">
        <h1 class="platform-banner__title banner-title" id="banner-title">行业公司<span class="platform-banner__accent banner-title-accent">概览</span></h1>
        <p class="platform-banner__subtitle banner-kicker" id="banner-subtitle">Industry Company Overview</p>
        <p class="platform-banner__description banner-description">全球能源、海工与工程企业信息检索平台</p>
      </div>

      <div class="platform-banner__visual banner-visual" aria-hidden="true">
        <img class="vessel-primary" src="assets/company-directory-banner-v2/vessel-primary.svg" alt="">
        <img class="vessel-secondary" src="assets/company-directory-banner-v2/vessel-secondary.svg" alt="">
      </div>
    </section>
  </main>
</body>
</html>
