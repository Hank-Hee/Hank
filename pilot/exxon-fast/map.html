<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ExxonMobil本地矢量项目地图A/B测试页面" />
    <title>ExxonMobil 本地矢量项目地图</title>
    <link rel="preload" href="assets/world-110m.svg?v=20260728-pilot-v2" as="image" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260728-pilot-v2" />
  </head>
  <body class="map-only-page">
    <main class="map-only-shell">
      <article class="dashboard-card map-card" data-vector-map>
        <header class="card-heading map-heading">
          <div><p class="eyebrow">VECTOR MAP · B VERSION</p><h1><span data-map-operator>ExxonMobil</span> 全球项目分布</h1><p>本地矢量底图 · 国家级聚合位置</p></div>
          <div class="map-kpis" aria-label="地图统计"><span><strong data-map-project-count>—</strong> 项目</span><span><strong data-map-country-count>—</strong> 国家</span></div>
        </header>
        <div class="map-viewport" data-map-viewport tabindex="0" aria-label="可缩放和拖动的世界项目地图">
          <div class="map-canvas" data-map-canvas>
            <img src="assets/world-110m.svg?v=20260728-pilot-v2" alt="世界国家边界底图" width="1000" height="500" decoding="async" />
            <div class="marker-layer" data-marker-layer aria-label="国家项目数量标记"></div>
          </div>
          <div class="map-controls" aria-label="地图缩放控制"><button type="button" data-map-zoom-in aria-label="放大地图">＋</button><button type="button" data-map-zoom-out aria-label="缩小地图">−</button><button type="button" data-map-reset aria-label="返回全球视图">全球</button></div>
          <div class="map-legend"><span class="legend-bubble">12</span><span>圆点数字代表项目数量</span></div>
          <div class="map-state" data-map-state><span class="state-spinner" aria-hidden="true"></span><strong>正在加载项目摘要…</strong></div>
        </div>
        <aside class="project-drawer" data-project-drawer hidden aria-label="项目列表">
          <header><div><p class="eyebrow">COUNTRY PROJECTS</p><h4 data-drawer-title>项目列表</h4><p data-drawer-summary></p></div><button type="button" class="drawer-close" data-drawer-close aria-label="关闭项目列表">×</button></header>
          <label class="drawer-search"><span>搜索项目</span><input type="search" data-drawer-search placeholder="项目、设施、业务区域" /></label>
          <p class="search-summary" data-search-summary></p>
          <div class="project-list" data-project-list></div>
        </aside>
      </article>
    </main>
    <script type="module" src="map-page.js?v=20260728-pilot-v2"></script>
  </body>
</html>
